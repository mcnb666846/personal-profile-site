<!DOCTYPE html>
<html lang="zh-CN" style="--primary-color:#6366f1;--primary-dark:#4f46e5;--secondary-color:#8b5cf6;--accent-color:#06b6d4;--primary-rgb:99,102,241;--secondary-rgb:139,92,246;--primary-gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);--rainbow-gradient:linear-gradient(135deg,#6366f1 0%,#8b5cf6 25%,#06b6d4 50%,#4f46e5 75%,#6366f1 100%);">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>登录 - CHUXUE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0a0f;
  color:#fff;
  padding:1rem;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 25% 25%, rgba(99,102,241,.22) 0%, transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(139,92,246,.16) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(6,182,212,.1) 0%, transparent 55%);
  z-index:-1;
}
.card{
  width:100%;
  max-width:400px;
  background:linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.04) 100%);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  padding:2.4rem 2rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 60px rgba(0,0,0,.5);
  animation:fadeUp .5s ease-out;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
.logo{
  text-align:center;
  font-size:1.8rem;
  font-weight:800;
  margin-bottom:.4rem;
  background:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  text-align:center;
  color:#a1a1aa;
  font-size:.9rem;
  margin-bottom:1.8rem;
}
.field{
  margin-bottom:1.2rem;
}
.field label{
  display:block;
  font-size:.85rem;
  color:#a1a1aa;
  margin-bottom:.5rem;
  font-weight:500;
}
.input-wrap{
  position:relative;
}
.input-wrap i{
  position:absolute;
  left:1rem;
  top:50%;
  transform:translateY(-50%);
  color:#71717a;
  font-size:.9rem;
}
input{
  width:100%;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:.9rem 1rem .9rem 2.8rem;
  color:#fff;
  font-size:1rem;
  transition:all .3s;
  font-family:inherit;
}
input::placeholder{
  color:#52525b;
}
input:focus{
  outline:none;
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,.2);
  background:rgba(255,255,255,.09);
}
.btn-login{
  width:100%;
  padding:1rem;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:all .3s;
  margin-top:.5rem;
  box-shadow:0 10px 25px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.25);
  font-family:inherit;
}
.btn-login:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 35px rgba(99,102,241,.5);
}
.btn-login:active{
  transform:translateY(0) scale(.98);
}
.msg{
  padding:.75rem 1rem;
  border-radius:10px;
  font-size:.9rem;
  margin-bottom:1.2rem;
  display:flex;
  align-items:center;
  gap:.5rem;
}
.msg.error{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.3);
  color:#fca5a5;
}
.msg.success{
  background:rgba(16,185,129,.12);
  border:1px solid rgba(16,185,129,.3);
  color:#6ee7b7;
}
.footer-links{
  text-align:center;
  margin-top:1.5rem;
  font-size:.9rem;
  color:#a1a1aa;
}
.footer-links a{
  color:#6366f1;
  text-decoration:none;
  font-weight:600;
}
.footer-links a:hover{
  color:#8b5cf6;
}
.back{
  text-align:center;
  margin-top:.8rem;
}
.back a{
  color:#71717a;
  text-decoration:none;
  font-size:.85rem;
}
.captcha-field{
  margin:1rem 0 .5rem;
  display:flex;
  justify-content:center;
}
@media (max-width:480px){
  .card{
    padding:2rem 1.4rem;
    border-radius:20px;
  }
  .logo{
    font-size:1.5rem;
  }
  body::before{
    display:none;
  }
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CHUXUE</div>
  <div class="sub">登录您的账号</div>
  <form method="post">
    <div class="field">
      <label>用户名 / 邮箱</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="请输入用户名或邮箱" required autocomplete="username">
      </div>
    </div>
    <div class="field">
      <label>密码</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
    </div>
    <div class="captcha-field">
      <div class="cf-captcha">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFNlIWHJ6Xl4PTi9" data-theme="dark"></div>
      </div>
      <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </div>
    <button type="submit" class="btn-login"><i class="fas fa-right-to-bracket"></i> 登 录</button>
  </form>
  <div class="footer-links">还没有账号？<a href="register.php">立即免费注册</a></div>

  <!-- 第三方登录 -->
  <div style="margin-top:1.5rem;">
    <div style="text-align:center;font-size:.78rem;color:#71717a;margin-bottom:1rem;position:relative;">
      <span style="background:rgba(10,10,15,.9);padding:0 .7rem;position:relative;z-index:1;">或使用第三方登录</span>
      <div style="position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,.08);z-index:0;"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;">
      <a href="login_oauth.php?type=1&mode=login" title="QQ登录" style="display:flex;align-items:center;justify-content:center;padding:.75rem;background:rgba(18,183,245,.1);border:1px solid rgba(18,183,245,.35);border-radius:12px;text-decoration:none;color:#fff;font-size:.7rem;flex-direction:column;gap:.3rem;transition:all .25s;">
        <i class="fab fa-qq" style="font-size:1.3rem;color:#12b7f5;"></i>
        <span>QQ</span>
      </a>
      <a href="login_oauth.php?type=2&mode=login" title="微信登录" style="display:flex;align-items:center;justify-content:center;padding:.75rem;background:rgba(7,193,96,.1);border:1px solid rgba(7,193,96,.35);border-radius:12px;text-decoration:none;color:#fff;font-size:.7rem;flex-direction:column;gap:.3rem;transition:all .25s;">
        <i class="fab fa-weixin" style="font-size:1.3rem;color:#07c160;"></i>
        <span>微信</span>
      </a>
      <a href="login_oauth.php?type=3&mode=login" title="支付宝登录" style="display:flex;align-items:center;justify-content:center;padding:.75rem;background:rgba(22,119,255,.1);border:1px solid rgba(22,119,255,.35);border-radius:12px;text-decoration:none;color:#fff;font-size:.7rem;flex-direction:column;gap:.3rem;transition:all .25s;">
        <i class="fab fa-alipay" style="font-size:1.3rem;color:#1677ff;"></i>
        <span>支付宝</span>
      </a>
      <a href="login_oauth.php?type=12&mode=login" title="抖音登录" style="display:flex;align-items:center;justify-content:center;padding:.75rem;background:rgba(254,44,85,.1);border:1px solid rgba(254,44,85,.35);border-radius:12px;text-decoration:none;color:#fff;font-size:.7rem;flex-direction:column;gap:.3rem;transition:all .25s;">
        <i class="fab fa-tiktok" style="font-size:1.3rem;color:#fe2c55;"></i>
        <span>抖音</span>
      </a>
    </div>
    <div style="text-align:center;font-size:.7rem;color:#52525b;margin-top:.7rem;">
      首次登录会自动创建账号，登录后可在个人主页绑定
    </div>
  </div>

  <div class="back"><a href="index.php"><i class="fas fa-arrow-left"></i> 返回首页</a></div>
</div>
</body>
</html>
